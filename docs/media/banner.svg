<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Purrsona: your writing voice, portable">
  <defs>
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ff9f43" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#14151b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="#14151b"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <!-- the voice graph: you, your circles, the rules that hang off them -->
  <g stroke="#3a3d4a" stroke-width="2" opacity="0.9">
    <line x1="1050" y1="180" x2="960" y2="104"/><line x1="1050" y1="180" x2="1150" y2="100"/>
    <line x1="1050" y1="180" x2="1160" y2="262"/><line x1="1050" y1="180" x2="950" y2="266"/>
    <line x1="960" y1="104" x2="905" y2="60"/><line x1="960" y1="104" x2="890" y2="132"/>
    <line x1="1150" y1="100" x2="1222" y2="62"/><line x1="1150" y1="100" x2="1236" y2="132"/>
    <line x1="1160" y1="262" x2="1240" y2="302"/><line x1="950" y1="266" x2="882" y2="304"/>
  </g>
  <g filter="url(#soft)" opacity="0.7">
    <circle cx="1050" cy="180" r="22" fill="#ff9f43"/>
    <circle cx="960" cy="104" r="14" fill="#2dd4bf"/><circle cx="1150" cy="100" r="14" fill="#2dd4bf"/>
    <circle cx="1160" cy="262" r="14" fill="#2dd4bf"/><circle cx="950" cy="266" r="12" fill="#60a5fa"/>
  </g>
  <circle cx="1050" cy="180" r="13" fill="#ffc078"/>
  <circle cx="960" cy="104" r="8" fill="#5eead4"/><circle cx="1150" cy="100" r="8" fill="#5eead4"/>
  <circle cx="1160" cy="262" r="8" fill="#5eead4"/><circle cx="950" cy="266" r="7" fill="#93c5fd"/>
  <g fill="#f472b6">
    <circle cx="905" cy="60" r="6"/><circle cx="890" cy="132" r="6"/><circle cx="1222" cy="62" r="6"/>
    <circle cx="1236" cy="132" r="6"/><circle cx="1240" cy="302" r="6"/><circle cx="882" cy="304" r="6"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9aa1b3">
    <text x="1050" y="218" text-anchor="middle">You</text>
    <text x="960" y="84" text-anchor="middle">Friends</text>
    <text x="1150" y="80" text-anchor="middle">Work</text>
    <text x="1160" y="292" text-anchor="middle">Clients</text>
    <text x="950" y="294" text-anchor="middle">LinkedIn</text>
  </g>

  <!-- the cat (the same drawing the extension uses) -->
  <g transform="translate(70 70) scale(3.4)">
    <path d="M44 50 C58 50 60 36 54 30" fill="none" stroke="#2f3340" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="31" cy="45" rx="16" ry="12.5" fill="#3b4050"/>
    <ellipse cx="31" cy="48" rx="8" ry="7" fill="#5a6072"/>
    <polygon points="18,19 21,5 28,14" fill="#3b4050"/>
    <polygon points="34,14 41,5 44,19" fill="#3b4050"/>
    <polygon points="21,15 22,9 26,13" fill="#f4a3b4"/>
    <polygon points="36,13 40,9 41,15" fill="#f4a3b4"/>
    <circle cx="31" cy="24" r="13" fill="#3b4050"/>
    <ellipse cx="26" cy="23" rx="2.6" ry="3.3" fill="#ffc44d"/>
    <ellipse cx="36" cy="23" rx="2.6" ry="3.3" fill="#ffc44d"/>
    <ellipse cx="26.6" cy="23.4" rx="1" ry="2.1" fill="#1b1d24"/>
    <ellipse cx="36.6" cy="23.4" rx="1" ry="2.1" fill="#1b1d24"/>
    <polygon points="29.5,28 32.5,28 31,29.8" fill="#f4a3b4"/>
    <path d="M31 30 q-2 2 -4 1 M31 30 q2 2 4 1" stroke="#c9ccd6" stroke-width="0.8" fill="none"/>
    <path d="M22 28 l-8 -1 M22 30 l-8 1 M40 28 l8 -1 M40 30 l8 1" stroke="#c9ccd6" stroke-width="0.7"/>
    <ellipse cx="24" cy="56" rx="4.5" ry="3" fill="#5a6072"/>
    <ellipse cx="38" cy="56" rx="4.5" ry="3" fill="#5a6072"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="330" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#f5f2ea">Purrsona</text>
    <text x="334" y="208" font-size="28" fill="#ffc078">Your writing voice, portable.</text>
    <text x="334" y="250" font-size="19" fill="#c3c7d4">Plug the key into any laptop and it writes</text>
    <text x="334" y="277" font-size="19" fill="#c3c7d4">the way you write to each person.</text>
    <text x="334" y="304" font-size="19" fill="#c3c7d4">Pull it out, and that laptop forgets you.</text>
  </g>
</svg>
