<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The Drafter writes from the graph's rules, the Critic checks the draft and sends it back once if it broke a rule, you edit and send, and the Learner turns your edit into a rule. All three share the FalkorDB voice graph.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8497"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f43"/></marker><radialGradient id="glow" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#ff9f43" stop-opacity="0.07"/><stop offset="1" stop-color="#14151b" stop-opacity="0"/></radialGradient></defs>
