[project]
name = "purrsona-api"
version = "0.1.0"
description = "Purrsona laptop side: voice graph, agents and the bridge API"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.11",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
